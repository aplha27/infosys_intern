<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 600px; margin-top: 50px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">🎤 AI Interview</h2>
        
        <button class="btn btn-primary w-100" onclick="startInterview()">🚀 Start Interview</button>

        <div id="questionSection" class="mt-4 hidden">
            <h4>Question:</h4>
            <p id="questionText" class="border p-3 bg-white shadow-sm"></p>

            <button class="btn btn-secondary mt-2 w-100" onclick="nextQuestion()">➡️ Next Question</button>
        </div>

        <div id="loading" class="mt-3 text-center hidden">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Processing...</span>
            </div>
        </div>
    </div>

    <script>
        function startInterview() {
            document.getElementById('loading').classList.remove('hidden');
            fetch('/start_interview', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').classList.add('hidden');
                    if (data.status === 'success') {
                        document.getElementById("questionSection").classList.remove("hidden");
                        document.getElementById("questionText").innerText = data.question;
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(error => console.error("Error:", error));
        }

        function nextQuestion() {
            document.getElementById('loading').classList.remove('hidden');
            fetch('/next_question', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').classList.add('hidden');
                    if (data.complete) {
                        alert(data.message);
                        window.location.href = "/";
                    } else {
                        document.getElementById("questionText").innerText = data.question || "Next question loading...";
                    }
                })
                .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
